<!DOCTYPE html>
<html lang="zh-Hans-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>HTML顯示工具</title>
    <style>
        textarea {width: 100%; height: 100px;}
        iframe {width: 100%; height: calc(100vh - 200px); }
    </style>
</head>
<body>
    <label>輸入HTML：</label><br>
    <textarea id="htmlText"></textarea><br>
    <label>顯示HTML：</label><br>
    <iframe id="htmlViewer"></iframe>
    <script>
        document.getElementById("htmlText").oninput = function () {
            document.getElementById("htmlViewer").src = `data:text/html;charset=utf-8,${this.value}`;
        }
    </script>
</body>
</html>
