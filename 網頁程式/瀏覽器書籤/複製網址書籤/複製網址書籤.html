把右邊這串字拖曳到書籤列即可使用：<a href='javascript:(() => {navigator.clipboard.writeText(decodeURIComponent(document.location.href))})()'>複製網址</a>
<br><br>如果您需要同時有去識別化功能，請改用此書籤：<a href='javascript:(async function(){try{const t=decodeURIComponent(document.location.href);if(!t)return;let u;try{u=new URL(t.trim())}catch(e){return}const h=u.hostname;if(h.includes("facebook.com")&&u.pathname==="/l.php"){const r=u.searchParams.get("u");if(r)u=new URL(decodeURIComponent(r))}else if(h==="www.google.com"&&u.pathname==="/url"){const r=u.searchParams.get("q")||u.searchParams.get("url");if(r)u=new URL(decodeURIComponent(r))}const p=["fbclid","gclid","igshid","ttclid","twclid","utm_source","utm_medium","utm_campaign","utm_term","utm_content","si"];p.forEach(x=>u.searchParams.delete(x));let c=u.toString();try{c=decodeURIComponent(c)}catch(e){};await navigator.clipboard.writeText(c);}catch(err){console.error(err)}})();'>複製網址</a>
